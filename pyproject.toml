[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "procon"
version = "0.1.0"
description = "Structured, evidence-cited analysis of business processes for automation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pydantic>=2.6", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
claude = ["anthropic>=1.11"]
dev = ["anthropic>=1.11", "pytest>=8.0", "httpx>=0.27", "ruff==0.8.6"]

[project.scripts]
procon = "procon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
