name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check --select E,F,W,B,I --ignore E501,B008 src tests eval
      - name: Tests (offline; the Claude analyzer is tested against a fake client)
        run: pytest -q
      - name: "Eval: heuristic against hand-written expectations"
        run: python eval/run_eval.py
